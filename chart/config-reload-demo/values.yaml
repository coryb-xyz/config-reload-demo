nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/coryb-xyz/config-reload-demo
  tag: ""
  pullPolicy: IfNotPresent

config:
  appName: "config-reload-demo"
  environment: "staging"
  logLevel: "info"
  featureFlags: "dark-mode,beta-ui"

secrets:
  create: true
  databaseUrl: "postgres://demo:demo@localhost:5432/demo"
  apiKey: "sk-demo-000000"

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 50m
    memory: 32Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
