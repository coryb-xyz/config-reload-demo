apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "config-reload-demo.fullname" . }}
  labels:
    {{- include "config-reload-demo.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  FEATURE_FLAGS: {{ .Values.config.featureFlags | quote }}
