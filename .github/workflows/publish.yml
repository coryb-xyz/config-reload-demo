name: Version and Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semVer }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.2.0
        with:
          versionSpec: '6.4.x'

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.2.0

      - name: Create tag
        id: tag
        uses: actions/github-script@v7
        env:
          SEMVER: ${{ steps.gitversion.outputs.semVer }}
        with:
          script: |
            const tag = `v${process.env.SEMVER}`;
            const ref = `refs/tags/${tag}`;

            // Check if tag already exists
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              console.log(`Tag ${tag} already exists, skipping.`);
              core.setOutput('created', 'false');
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // Create the tag
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
              sha: context.sha,
            });
            console.log(`Created tag ${tag}`);
            core.setOutput('created', 'true');

  build-and-push-image:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/config-reload-demo:${{ needs.version.outputs.semver }}
            ghcr.io/${{ github.repository_owner }}/config-reload-demo:latest
            ghcr.io/${{ github.repository_owner }}/config-reload-demo:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint chart/config-reload-demo/

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          VERSION="${{ needs.version.outputs.semver }}"
          helm package chart/config-reload-demo/ --version "$VERSION" --app-version "$VERSION"
          helm push config-reload-demo-"$VERSION".tgz oci://ghcr.io/${{ github.repository_owner }}/charts
