name: Version and Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.calc.outputs.version }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc
        run: |
          # Find the latest semver tag (vX.Y.Z only, no pre-release)
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No semver tag found, starting at 0.1.0"
            LATEST_TAG="v0.0.0"
            RANGE="HEAD"
          else
            echo "Latest tag: $LATEST_TAG"
            RANGE="${LATEST_TAG}..HEAD"
          fi

          # Parse current version
          VERSION="${LATEST_TAG#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          # Scan commit messages for +semver: directives
          BUMP="patch"
          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE '\+semver:\s*(breaking|major)'; then
              BUMP="major"
              break
            elif echo "$msg" | grep -qiE '\+semver:\s*(feature|minor)'; then
              BUMP="minor"
            fi
          done < <(git log --format=%B "$RANGE")

          # Apply bump
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump type: $BUMP"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        id: tag
        uses: actions/github-script@v7
        env:
          SEMVER: ${{ steps.calc.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.SEMVER}`;
            const ref = `refs/tags/${tag}`;

            // Check if tag already exists
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              console.log(`Tag ${tag} already exists, skipping.`);
              core.setOutput('created', 'false');
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // Create the tag
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
              sha: context.sha,
            });
            console.log(`Created tag ${tag}`);
            core.setOutput('created', 'true');

  build-and-push-image:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/config-reload-demo:${{ needs.version.outputs.semver }}
            ghcr.io/${{ github.repository_owner }}/config-reload-demo:latest
            ghcr.io/${{ github.repository_owner }}/config-reload-demo:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.semver }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm lint
        run: helm lint chart/config-reload-demo/

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          VERSION="${{ needs.version.outputs.semver }}"
          helm package chart/config-reload-demo/ --version "$VERSION" --app-version "$VERSION"
          helm push config-reload-demo-"$VERSION".tgz oci://ghcr.io/${{ github.repository_owner }}/charts
